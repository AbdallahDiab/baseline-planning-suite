services:
  shell:
    build:
      context: .
      dockerfile: Dockerfile
      target: shell
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  people:
    build:
      context: .
      dockerfile: Dockerfile
      target: people
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  delivery:
    build:
      context: .
      dockerfile: Dockerfile
      target: delivery
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      PORT: "3000"
      DATA_FILE: /data/baseline-store.json
      SEED_FILE: /app/fixtures/baseline-seed.json
    volumes:
      - api-data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    ports:
      - "8080:8080"
    environment:
      PEOPLE_REMOTE_URL: /people/mf-manifest.json
      DELIVERY_REMOTE_URL: /delivery/mf-manifest.json
    depends_on:
      shell:
        condition: service_healthy
      people:
        condition: service_healthy
      delivery:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  api-data:
